 bond_market_show_trust: "Show Bond Trust"
 bond_market_show_trust_desc: "Display current bond trust level, tier, and economic status"
 bond_market_add_journal_entry: "Add Bond Market Journal Entry"
 bond_market_add_journal_entry_desc: "Add the Bond Market journal entry to track trust levels during gameplay"
 bond_market_set_trust_10: "Set Trust to 10 (Very Low)"
 bond_market_set_trust_10_desc: "Set bond trust to 10 for testing very low trust effects"
 bond_market_set_trust_50: "Set Trust to 50 (Medium)"
 bond_market_set_trust_50_desc: "Set bond trust to 50 for testing medium trust effects"
 bond_market_set_trust_95: "Set Trust to 95 (Very High)"
 bond_market_set_trust_95_desc: "Set bond trust to 95 for testing very high trust effects"

# Modifier localization
 bond_trust_tier_very_low: "Very Low Bond Trust"
 bond_trust_tier_very_low_desc: "Our terrible credit history has severely increased borrowing costs and greatly reduced credit capacity"
 bond_trust_tier_low: "Low Bond Trust"
 bond_trust_tier_low_desc: "Our poor credit history has led to higher borrowing costs and reduced credit capacity"
 bond_trust_tier_medium: "Medium Bond Trust"
 bond_trust_tier_medium_desc: "Our average credit standing has a moderate impact on borrowing costs"
 bond_trust_tier_high: "High Bond Trust"
 bond_trust_tier_high_desc: "Our good credit rating provides borrowing cost relief and increased credit capacity"
 bond_trust_tier_very_high: "Very High Bond Trust"
 bond_trust_tier_very_high_desc: "Our excellent credit rating provides significant borrowing cost relief and greatly increased credit capacity"

 # Shopkeeper generosity campaign modifiers
 shopkeeper_generosity_campaign: "Patriotic Shopkeeper Campaign"
 shopkeeper_generosity_campaign_desc: "Our shopkeepers have launched a patriotic donation campaign, boosting their political influence but straining the economy and reducing their wealth contributions to cash reserves"

 trade_route_pillaging: "Disrupted Trade Routes"
 trade_route_pillaging_desc: "The seizure of trade goods has severely disrupted international commerce, reduced diplomatic relations, and increased internal radicalism"

 jubilee_radicalization: "Capitalist Radicalization"
 jubilee_radicalization_desc: "The jubilee debt forgiveness has severely radicalized our capitalist class, who view this as an attack on property rights and economic stability"

 small_bond_market_treasury_boost: "Bond Market Treasury Boost"
 small_bond_market_treasury_boost_desc: "International investor confidence provides a temporary boost to treasury income"
 medium_bond_market_treasury_boost: "Strong Bond Market Treasury Boost"
 medium_bond_market_treasury_boost_desc: "Strong international investor confidence provides a significant boost to treasury income"
 high_bond_market_treasury_boost: "Excellent Bond Market Treasury Boost"
 high_bond_market_treasury_boost_desc: "Excellent international investor confidence provides a major boost to treasury income"


 # Capitalist Political Strength Modifiers
 small_capitalist_political_boost: "Minor Capitalist Influence Boost"
 small_capitalist_political_boost_desc: "Capitalist interests have gained a small increase in political influence"
 medium_capitalist_political_boost: "Moderate Capitalist Influence Boost"
 medium_capitalist_political_boost_desc: "Capitalist interests have gained a moderate increase in political influence"
 large_capitalist_political_boost: "Major Capitalist Influence Boost"
 large_capitalist_political_boost_desc: "Capitalist interests have gained a significant increase in political influence"

 small_capitalist_political_penalty: "Minor Capitalist Influence Reduction"
 small_capitalist_political_penalty_desc: "Capitalist interests have suffered a small reduction in political influence"
 medium_capitalist_political_penalty: "Moderate Capitalist Influence Reduction"
 medium_capitalist_political_penalty_desc: "Capitalist interests have suffered a moderate reduction in political influence"
 large_capitalist_political_penalty: "Major Capitalist Influence Reduction"
 large_capitalist_political_penalty_desc: "Capitalist interests have suffered a significant reduction in political influence"

# New bond market events
 bond_market_income_title: "Bond Market Confidence Boost"
 bond_market_income_desc: "Our strong bond market standing has attracted international investors, providing a sustained boost to our tax revenue for the coming months."
 bond_market_income_flavor: "Foreign capital flows into our prosperous economy."
 bond_market_income_option: "Excellent news!"

 bond_market_capitalist_radicalism_title: "Capitalist Discontent"
 bond_market_capitalist_radicalism_desc: "The poor state of our national credit has shaken confidence among our capitalist class. Fearing economic instability, many are becoming increasingly radical in their demands for change."
 bond_market_capitalist_radicalism_flavor: "Economic uncertainty breeds political extremism."
 bond_market_capitalist_radicalism_option_accept: "Accept their demands"
 bond_market_capitalist_radicalism_option_accept_desc: "This could be problematic"
 bond_market_capitalist_radicalism_option_reject: "Reject their demands"
 bond_market_capitalist_radicalism_option_reject_desc: "To hell with them"

 bond_market_trade_union_radicalism_title: "Worker Unrest in Economic Boom"
 bond_market_trade_union_radicalism_desc: "Despite our excellent economic standing, trade unions are growing increasingly radical. Workers feel that the benefits of our success are not being fairly distributed."
 bond_market_trade_union_radicalism_flavor: "Prosperity without equity breeds discontent."
 bond_market_trade_union_radicalism_option_accept: "Address their concerns"
 bond_market_trade_union_radicalism_option_accept_desc: "Implement workers' rights reforms"
 bond_market_trade_union_radicalism_option_reject: "Dismiss their demands"
 bond_market_trade_union_radicalism_option_reject_desc: "The workers should be grateful for the economic success"

 bond_market_industrialist_loyalty_title: "Industrialist Investment Opportunity"
 bond_market_industrialist_loyalty_desc: "Our industrial leaders are offering substantial investment capital in exchange for accepting a temporary hit to our bond market reputation. They argue that domestic industrial priorities should take precedence over international financial perceptions."
 bond_market_industrialist_loyalty_flavor: "Domestic industry demands political priority over global finance."
 bond_market_industrialist_loyalty_accept: "Accept the industrialists' offer (-10 Bond Trust)"
 bond_market_industrialist_loyalty_decline: "Maintain our current financial strategy"

# Journal entry localization
 je_bond_market_debug: "The Bond Market"
 je_bond_market_debug_status: "Trust: [GetPlayer.MakeScope.ScriptValue('bond_market_trust_value')|0]\nDebt: [GetPlayer.MakeScope.ScriptValue('bond_market_debt_percentage')|0]%\nIncome: [GetPlayer.MakeScope.ScriptValue('bond_market_net_income')|0]"
 je_bond_market_debug_reason: "Monitoring bond market trust levels and economic indicators"

 je_bond_market_default: "A State of Default"
 je_bond_market_default_status: "Our nation is currently in a state of sovereign default. This severely damages our international credit reputation and limits our ability to borrow on favorable terms. We must work to restore confidence in our economy and repay our debts."
 je_bond_market_default_reason: "Tracking our nation's sovereign default status and recovery progress"

 bond_market_default_recovery_title: "Default Recovery Strategy"
 bond_market_default_recovery_desc: "As we struggle with sovereign default, our political factions are offering different paths to recovery. Industrialists propose aggressive economic restructuring that would prioritize their interests, while conservatives advocate for measured reforms that maintain broader political balance."
 bond_market_default_recovery_flavor: "Political factions vie for control of economic recovery."
 bond_market_default_recovery_industrialist: "Embrace Industrialist-Led Recovery"
 bond_market_default_recovery_industrialist_desc: "Industrialists gain significant influence while other groups suffer. Gain 30 bond trust."
 bond_market_default_recovery_conservative: "Pursue Balanced Recovery"
 bond_market_default_recovery_conservative_desc: "Maintain political balance but disappoint industrialists. Gain 10 bond trust."

# Bond market rating events
 bond_market_rating_aaa_title: "AAA Bond Rating Achieved"
 bond_market_rating_aaa_desc: "Our country's impeccable financial standing has earned us the highest possible bond rating. Investors worldwide view us as a prime credit risk, ensuring access to capital at the most favorable terms."
 bond_market_rating_aaa_flavor: "The pinnacle of financial credibility."
 bond_market_rating_aa_title: "AA Bond Rating Achieved"
 bond_market_rating_aa_desc: "Our excellent economic management has secured us a high-grade bond rating. While not quite at the absolute pinnacle, we enjoy very favorable borrowing conditions and strong investor confidence."
 bond_market_rating_aa_flavor: "A mark of exceptional financial health."
 bond_market_rating_a_title: "A Bond Rating Achieved"
 bond_market_rating_a_desc: "Our solid economic fundamentals have earned us an upper-medium grade bond rating. Investors see us as a reliable borrower with good prospects for meeting our financial obligations."
 bond_market_rating_a_flavor: "Strong financial standing recognized."
 bond_market_rating_b_title: "B Bond Rating Achieved"
 bond_market_rating_b_desc: "Our moderate economic performance has resulted in a lower-medium grade bond rating. While not ideal, we still have access to international capital markets, albeit at somewhat higher costs."
 bond_market_rating_b_flavor: "Room for improvement in our credit profile."
 bond_market_rating_c_title: "C Bond Rating Achieved"
 bond_market_rating_c_desc: "Our financial situation has led to a speculative-grade bond rating. Investors view us as having moderate risk, requiring higher interest rates to compensate for the uncertainty."
 bond_market_rating_c_flavor: "Our creditworthiness is in question."
 bond_market_rating_d_title: "D Bond Rating Achieved"
 bond_market_rating_d_desc: "Our poor economic management has resulted in a highly speculative bond rating. International investors are wary of our ability to meet financial obligations, significantly increasing borrowing costs."
 bond_market_rating_d_flavor: "A warning sign for our economy."
 bond_market_rating_f_title: "F Bond Rating Achieved"
 bond_market_rating_f_desc: "Our severe financial distress has led to the lowest possible bond rating. We are viewed as a distressed borrower, with extremely limited access to international capital markets and exorbitant borrowing costs."
 bond_market_rating_f_flavor: "Default looms as a real possibility."
 bond_market_rating_acknowledge: "Acknowledge"

# Low Bond Trust Crisis Events
 bond_market_low_trust_crisis_title: "Bailout Demands"
 bond_market_low_trust_crisis_desc: "With our bond market confidence faltering, capitalist leaders are demanding immediate government intervention to stabilize financial markets. They argue that a substantial treasury injection is necessary to prevent a complete market collapse."
 bond_market_low_trust_crisis_flavor: "Economic uncertainty breeds demands for intervention."
 bond_market_low_trust_bailout: "Authorize the Bailout (-10 Trust)"
 bond_market_low_trust_reject: "We have this situation under control (+20 Trust)"

 # Shopkeeper Generosity Event
 bond_market_shopkeeper_generosity_title: "Patriotic Shopkeeper Donation"
 bond_market_shopkeeper_generosity_desc: "In a display of national solidarity during our time of crisis, the shopkeeper class has organized a massive patriotic donation campaign. They are offering to contribute a significant portion of their wealth to the treasury, but this generosity comes with political expectations and economic strain on the population."
 bond_market_shopkeeper_generosity_flavor: "Shopkeepers show their patriotism through sacrifice."
 bond_market_shopkeeper_generosity_accept: "Accept the Generous Donation"
 bond_market_shopkeeper_generosity_decline: "Politely Decline Their Offer"

 # Trade Route Pillaging Event
 bond_market_pillage_trade_title: "Seizure of Trade Goods"
 bond_market_pillage_trade_desc: "Desperate for revenue during our sovereign default, officials have authorized the seizure of valuable goods from trade caravans and merchant vessels operating within our territory. This provides immediate treasury income but disrupts international trade and angers our diplomatic partners."
 bond_market_pillage_trade_flavor: "Desperate measures for desperate times."
 bond_market_pillage_trade_accept: "Authorize the Seizures"
 bond_market_pillage_trade_decline: "Respect International Trade"

 # Jubilee Event
 bond_market_jubilee_title: "Economic Jubilee"
 bond_market_jubilee_desc: "In a radical move to address the economic suffering caused by our default, the government has declared a 'jubilee' - canceling debts and distributing relief funds to the population. While this provides immediate economic relief, it has outraged our capitalist class who see their investments and loan repayments evaporate."
 bond_market_jubilee_flavor: "Forgiving debts in times of crisis."
 bond_market_jubilee_accept: "Declare the Jubilee"
 bond_market_jubilee_decline: "Maintain Property Rights"

 # Balance Event
 bond_market_balance_crisis_title: "Bond Market Balance Crisis"
 bond_market_balance_crisis_desc: "International financial markets are pressuring our government to address imbalances in our economic policies. We must choose between alienating a powerful interest group or damaging our international credit rating."
 bond_market_balance_crisis_flavor: "The global economy demands difficult choices from major powers."
 bond_market_balance_hurt_ig: "Confront the Interest Group"
 bond_market_balance_hurt_ig_desc: "Reduce approval with the [saved_ig.GetName] to maintain our bond market standing."
 bond_market_balance_lose_trust: "Accept Credit Damage"
 bond_market_balance_lose_trust_desc: "Take a significant hit to our bond trust rather than alienating domestic interests."

 # Barracks Expansion Military Bonus Event
 bond_market_barracks_expansion_title: "Military Readiness Boost"
 bond_market_barracks_expansion_desc: "Our substantial gold reserves and strong international credit standing have enabled us to provide our military with exceptional training facilities and equipment following the expansion of our barracks. Our army's combat effectiveness has been significantly enhanced."
 bond_market_barracks_expansion_flavor: "Financial strength translates to military might."
 bond_market_barracks_expansion_option: "Our soldiers stand ready!"

 # Small Military Boost Modifier
 lpr_bond_market_small_military_boost: "Enhanced Military Readiness"
 lpr_bond_market_small_military_boost_desc: "Army units have 15% higher offensive and defensive capabilities, with improved organization recovery, movement speed, and 10% lower military goods costs"

 # Medium Military Boost Modifier
 lpr_bond_market_medium_military_boost: "Advanced Military Readiness"
 lpr_bond_market_medium_military_boost_desc: "Army units have 25% higher offensive and defensive capabilities, with enhanced organization recovery, movement speed, and 15% lower military goods costs"

 # Large Military Boost Modifier
 lpr_bond_market_large_military_boost: "Elite Military Readiness"
 lpr_bond_market_large_military_boost_desc: "Army units have 50% higher offensive and defensive capabilities, with enhanced organization recovery, movement speed, and 25% lower military goods costs"

 # Interest Group Approval Penalty Modifiers
 bond_market_small_interest_group_approval_penalty: "Mild Public Disapproval"
 bond_market_small_interest_group_approval_penalty_desc: "This interest group faces mild public disapproval, slightly reducing their approval rating"

 bond_market_medium_interest_group_approval_penalty: "Public Disapproval"
 bond_market_medium_interest_group_approval_penalty_desc: "This interest group faces public disapproval, moderately reducing their approval rating"

 bond_market_large_interest_group_approval_penalty: "Severe Public Disapproval"
 bond_market_large_interest_group_approval_penalty_desc: "This interest group faces severe public disapproval, significantly reducing their approval rating"
