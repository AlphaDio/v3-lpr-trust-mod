l_english:

# Event localization
 bond_market_trust_update_title: "Bond Market Trust Update"
 bond_market_trust_update_desc: "The international bond market has reassessed our country's creditworthiness based on our economic performance."
 bond_market_trust_update_flavor: "Global financial markets react to our fiscal policies."
 bond_market_trust_update_option: "Continue"

# Debug events (not currently used)
 bond_market_debug_show_title: "Bond Market Debug: Current Trust"
 bond_market_debug_show_desc: "Trust: [GetPlayer.MakeScope.ScriptValue('bond_market_trust_value')|0]\nDebt: [GetPlayer.MakeScope.ScriptValue('bond_market_debt_percentage')|0]%\nIncome: [GetPlayer.MakeScope.ScriptValue('bond_market_net_income')|0]"
 bond_market_debug_show_option: "Understood"

 bond_market_debug_set_title: "Bond Market Debug: Trust Updated"
 bond_market_debug_set_desc: "Bond trust has been updated."
 bond_market_debug_set_option: "Continue"

# Decision localization
 bond_market_debug_category: "Bond Market Debug"
